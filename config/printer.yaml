name: Bambu Lab X2D
nozzle: 0.4
beds:
  single_nozzle: [256, 256]
  dual_nozzle: [235.5, 256]
bed: single_nozzle          # which entry of `beds` trays are checked against

# Design rules, mm. A game can override any of them under `rules:` in game.yaml.
rules:
  wall: 1.6                 # outer tray wall, 4 lines at 0.4
  divider: 1.2              # wall between compartments of one tray, 3 lines
  floor: 1.2
  clearance: 0.5            # per side, component to compartment
  box_margin: 1.0           # insert is this much smaller than the box interior in X and Y (total)
  top_clearance: 1.0        # extra gap above the insert + items lying on top, so the lid closes
  stretch: false            # true grows trays to fill the box, but BIT walls are solid: ~5x filament in a sparse box

# `insertgen build --slice`: Bambu Studio CLI, system profiles from the app bundle.
slicer:
  machine: Bambu Lab X2D 0.4 nozzle
  process: 0.20mm Standard @BBL X2D
  filament: Bambu PLA Basic @BBL X2D 0.4 nozzle
  # Bambu's CLI reports 0 g with system profiles, so grams come from filament length.
  filament_diameter: 1.75
  filament_density: 1.24    # g/cm3, PLA
