[project]
name = "insertgen"
version = "0.1.0"
description = "Parametric 3D-printable board game insert generator on top of the Boardgame Insert Toolkit"
requires-python = ">=3.11"
license = "CC-BY-NC-SA-4.0"
dependencies = ["pydantic>=2.7", "pyyaml>=6", "typer>=0.12"]

[project.scripts]
insertgen = "insertgen.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/insertgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
